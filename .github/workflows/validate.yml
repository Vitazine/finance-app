name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Portable tests without Android SDK or model
        run: ./gradlew -PcoreOnly=true :shared:jvmTest :shared:ktlintCheck --no-daemon
      - name: Verify checked-in Room schema
        run: |
          git diff --exit-code -- shared/schemas
          test -z "$(git ls-files --others --exclude-standard -- shared/schemas)"
      - name: Architecture and privacy boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check_boundaries.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Compile, test, format and lint
        run: ./gradlew :shared:allTests :shared:ktlintCheck :androidApp:ktlintCheck :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --no-daemon
      - name: Verify checked-in Room schema
        run: |
          git diff --exit-code -- shared/schemas
          test -z "$(git ls-files --others --exclude-standard -- shared/schemas)"
      - name: Validate packaged manifest privacy policy
        run: python3 scripts/check_boundaries.py --manifest androidApp/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/androidTest/debug/*.apk
            androidApp/build/reports/
            shared/build/reports/
          if-no-files-found: warn
          retention-days: 7

  # Instrumentation APK is compiled above. UI execution requires a device;
  # no job here claims that compilation is a passed UI test.
